name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Run tests
        run: swift test --parallel

      - name: Package app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package_app.sh release

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacViewer.app dist/MacViewer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacViewer-${{ github.sha }}
          path: dist/MacViewer.zip
          retention-days: 14

  # Experimental macOS 11 build; it doesn't fail CI while Big Sur support is
  # unproven. Xcode 27 can't target below 12, so it uses Xcode 16.
  build-macos11:
    name: Build for macOS 11 (experimental)
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    env:
      MACVIEWER_MIN_MACOS: "11"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Package app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_UNIVERSAL: "1"
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/package_app.sh release
          vtool -show-build dist/MacViewer.app/Contents/MacOS/MacViewer | grep -E "minos|platform"
          otool -L dist/MacViewer.app/Contents/MacOS/MacViewer | grep -i swift_Concurrency
          otool -l dist/MacViewer.app/Contents/MacOS/MacViewer | grep -A2 LC_RPATH | grep path

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacViewer.app dist/MacViewer-macOS11.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacViewer-macOS11-${{ github.sha }}
          path: dist/MacViewer-macOS11.zip
          retention-days: 14

  linux:
    name: LinuxViewer (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinuxViewer
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libx11-dev libxcb1-dev libasound2-dev libpipewire-0.3-dev libclang-dev clang pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: linuxviewer-${{ github.sha }}
          path: LinuxViewer/target/release/linuxviewer
          retention-days: 14
