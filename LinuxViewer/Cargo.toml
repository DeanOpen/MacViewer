[package]
name = "linuxviewer"
version = "0.1.0"
edition = "2021"
description = "UltraViewer-compatible remote desktop client and host for Linux (Rust port of MacViewer)"
license = "MIT"

[lib]
name = "linuxviewer"
path = "src/lib.rs"

[[bin]]
name = "linuxviewer"
path = "src/main.rs"

[features]
default = ["wayland"]
# Wayland hosting through xdg-desktop-portal + PipeWire (Linux only).
wayland = ["dep:ashpd", "dep:pipewire", "dep:tokio"]

[dependencies]
base64 = "0.22"
cpal = "0.15"
font8x8 = "0.3"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
aes = "0.8"
getrandom = "0.3"
jpeg-decoder = { version = "0.3", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
softbuffer = "0.4"
winit = "0.30"
zstd-safe = { version = "7", features = ["experimental", "std"] }
png = "0.17"
ctrlc = "3"
unicode-normalization = "0.1"
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr", "shm"] }
libc = "0.2"
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
pipewire = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[profile.release]
lto = "thin"
